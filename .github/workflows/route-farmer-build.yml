name: Build Torch Route Farmer APK
on:
  push:
    branches: [iris-controller]
    paths:
      - 'torchlight-bot/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/route-farmer-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle :torchlight-bot:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torch-map-farmer-0.3.0
          path: torchlight-bot/build/outputs/apk/debug/torchlight-bot-debug.apk
          if-no-files-found: error
