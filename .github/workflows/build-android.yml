name: Build Torch AI and Torchlight Bot APKs
on:
  workflow_dispatch:
  push:
    branches: [iris-controller]
    paths: ['app/**', 'torchlight-bot/**', '*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both Android APKs
        run: gradle :app:assembleDebug :torchlight-bot:assembleDebug
      - name: Upload Torch AI APK
        uses: actions/upload-artifact@v4
        with:
          name: torch-controller-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Torchlight Bot APK
        uses: actions/upload-artifact@v4
        with:
          name: torchlight-bot-debug
          path: torchlight-bot/build/outputs/apk/debug/torchlight-bot-debug.apk
