name: Build Torch Controller APK # live teaching update
on:
  workflow_dispatch:
  push:
    branches: [iris-controller]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torch-controller-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# Rebuild on live-teaching revisions
